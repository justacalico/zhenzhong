app-id: gitlab.httpanimations.zhenzhong
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: zhenzhong
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --socket=pulseaudio
modules:
  - name: zhenzhong
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/share/zhenzhong /app/share/applications /app/share/icons/hicolor/512x512/apps
      - cp -r bundle/* /app/share/zhenzhong/
      - ln -s /app/share/zhenzhong/zhenzhong /app/bin/zhenzhong
      - install -Dm644 zhenzhong.desktop /app/share/applications/gitlab.httpanimations.zhenzhong.desktop
      - install -Dm644 zhenzhong.png /app/share/icons/hicolor/512x512/apps/gitlab.httpanimations.zhenzhong.png
    sources:
      - type: dir
        path: bundle
      - type: file
        path: ../linux/zhenzhong.desktop
      - type: file
        path: ../linux/zhenzhong.png
