name: zhenzhong
description: "震中 - a FOSS Mahjongg solitaire game."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  package_info_plus: ^8.1.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  window_manager: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/icon.png

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: assets/icon_foreground.png
  web:
    generate: true
    image_path: assets/icon.png
    background_color: "#1B5E20"
    theme_color: "#1B5E20"
  windows:
    generate: true
    image_path: assets/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon.png
