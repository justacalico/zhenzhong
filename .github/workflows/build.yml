name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all targets'
        type: boolean
        default: true
      create_release:
        description: 'Create a versioned release'
        type: boolean
        default: false
      merge_request_id:
        type: string
        default: ''
      merge_request_url:
        type: string
        default: ''

permissions:
  contents: write
  actions: read

env:
  FLUTTER_VERSION: "3.47.7"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      build_all: ${{ steps.meta.outputs.build_all }}
      targets: ${{ steps.meta.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Read metadata
        id: meta
        run: |
          VERSION=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml | head -1)
          BUILD_NUMBER=$(date +%s | cut -c4-10)
          BUILD_ALL="${{ inputs.build_all || 'true' }}"
          if [ "$BUILD_ALL" = "true" ]; then
            TARGETS='[{"target":"android","os":"ubuntu-latest"},{"target":"linux","os":"ubuntu-latest"},{"target":"linux-arm64","os":"ubuntu-24.04-arm","flutter":"git"},{"target":"windows","os":"windows-latest"},{"target":"macos","os":"macos-latest","flutter_arch":"arm64"},{"target":"ios","os":"macos-latest","flutter_arch":"arm64"},{"target":"web","os":"ubuntu-latest"}]'
          else
            TARGETS='[{"target":"web","os":"ubuntu-latest"}]'
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_all=$BUILD_ALL" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Analyze, test, coverage
        run: |
          flutter config --no-analytics
          flutter pub get
          (cd landing && flutter pub get)
          flutter analyze
          bash scripts/check-coverage.sh

  build:
    name: Build ${{ matrix.target }}
    needs: [setup, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.targets) }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      BUILD_NUMBER: ${{ needs.setup.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Java 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        if: matrix.flutter != 'git'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ matrix.flutter_arch || 'x64' }}
          cache: true
      - name: Install Flutter from source (arm64)
        if: matrix.flutter == 'git'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ env.FLUTTER_VERSION }}" https://github.com/flutter/flutter.git "$HOME/flutter-sdk"
          echo "$HOME/flutter-sdk/bin" >> "$GITHUB_PATH"
          if [ "${{ matrix.target }}" = "linux-arm64" ]; then
            "$HOME/flutter-sdk/bin/flutter" precache --linux
          fi
      - name: Install Linux deps
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev zip dpkg-dev rpm flatpak flatpak-builder ostree curl
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
          flatpak install -y --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 || true
      - name: Setup Android signing
        id: signing
        if: matrix.target == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" != "refs/heads/main" && ! "${{ github.ref }}" =~ ^refs/tags/ ]]; then
            echo "signing=debug" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing Android signing configuration on a release build" >&2; exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > android/zhenzhong.jks
          printf 'storeFile=../zhenzhong.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
          echo "signing=release" >> "$GITHUB_OUTPUT"
      - name: Build Android
        if: matrix.target == 'android'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          flutter config --no-analytics
          flutter pub get
          if [ "${{ steps.signing.outputs.signing }}" = "release" ]; then
            flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
            flutter build appbundle --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
            cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/artifacts/zhenzhong-android.apk"
            cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/artifacts/zhenzhong-android.aab"
          else
            flutter build apk --debug --build-name="$VERSION" --build-number="$BUILD_NUMBER"
            cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/artifacts/zhenzhong-android.apk"
          fi
      - name: Build Linux packages
        if: startsWith(matrix.target, 'linux')
        run: |
          set -euo pipefail
          A="$GITHUB_WORKSPACE/artifacts"; mkdir -p "$A"
          flutter config --no-analytics
          flutter pub get
          flutter config --enable-linux-desktop
          flutter build linux --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          if [ "${{ matrix.target }}" = "linux-arm64" ]; then
            LARCH=arm64; OUT=arm64; FLATARCH=aarch64
          else
            LARCH=x64; OUT=x86_64; FLATARCH=x86_64
          fi
          B="build/linux/$LARCH/release/bundle"
          tar -czf "$A/zhenzhong-linux-$OUT.tar.gz" -C "$B" .
          (cd "$B" && zip -r "$A/zhenzhong-linux-$OUT.zip" . >/dev/null)
          pd="$GITHUB_WORKSPACE/pkgdeb"; mkdir -p "$pd/opt/zhenzhong" "$pd/usr/bin" "$pd/DEBIAN"
          cp -r "$B/." "$pd/opt/zhenzhong/"
          ln -sf /opt/zhenzhong/zhenzhong "$pd/usr/bin/zhenzhong"
          install -Dm644 packaging/linux/zhenzhong.desktop "$pd/usr/share/applications/gitlab.httpanimations.zhenzhong.desktop"
          install -Dm644 packaging/linux/zhenzhong.png "$pd/usr/share/icons/hicolor/512x512/apps/zhenzhong.png"
          install -Dm644 LICENSE "$pd/usr/share/doc/zhenzhong/copyright"
          { echo "Package: zhenzhong"; echo "Version: $VERSION"; echo "Section: games"; echo "Priority: optional"; echo "Architecture: $([ "$OUT" = arm64 ] && echo arm64 || echo amd64)"; echo "Maintainer: Zhenzhong CI <ci@gitlab.com>"; echo "Depends: libgtk-3-0"; echo "Description: Mahjongg solitaire game"; } > "$pd/DEBIAN/control"
          dpkg-deb --build "$pd" "$A/zhenzhong-linux-$OUT.deb" >/dev/null
          mkdir -p flatpak-repo-$FLATARCH
          rm -rf packaging/flatpak/bundle && cp -r "$B" packaging/flatpak/bundle
          flatpak-builder --force-clean --repo="flatpak-repo-$FLATARCH" --arch="$FLATARCH" fpbuild packaging/flatpak/gitlab.httpanimations.zhenzhong.yml
          tar -czf "$A/flatpak-repo-$FLATARCH.tar.gz" -C "flatpak-repo-$FLATARCH" .
      - name: Build Windows
        if: startsWith(matrix.target, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          A="$GITHUB_WORKSPACE/artifacts"; mkdir -p "$A"
          flutter config --no-analytics
          flutter pub get
          flutter config --enable-windows-desktop
          flutter build windows --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          R="build/windows/x64/runner/Release"
          powershell -NoProfile -Command "Compress-Archive -Path '$(cygpath -w "$R")\\*' -DestinationPath '$(cygpath -w "$A/zhenzhong-windows-x86_64.zip")' -Force"
      - name: Build macOS
        if: matrix.target == 'macos'
        run: |
          set -euo pipefail
          A="$GITHUB_WORKSPACE/artifacts"; mkdir -p "$A"
          flutter config --no-analytics
          flutter pub get
          flutter config --enable-macos-desktop
          flutter build macos --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          APP="build/macos/Build/Products/Release/Zhenzhong.app"
          codesign --force --deep --sign - "$APP" || true
          (cd "$(dirname "$APP")" && zip -r "$A/zhenzhong-macos-arm64.zip" "Zhenzhong.app" >/dev/null)
          hdiutil create -volname "Zhenzhong" -srcfolder "$APP" -ov -format UDZO "$A/zhenzhong-macos-arm64.dmg" || true
      - name: Build iOS (unsigned)
        if: matrix.target == 'ios'
        run: |
          set -euo pipefail
          A="$GITHUB_WORKSPACE/artifacts"; mkdir -p "$A"
          flutter config --no-analytics
          flutter pub get
          flutter build ios --release --no-codesign --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          rm -rf Payload && mkdir Payload && cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "$A/zhenzhong-ios-arm64-unsigned.ipa" Payload >/dev/null
      - name: Build Web
        if: matrix.target == 'web'
        run: |
          set -euo pipefail
          A="$GITHUB_WORKSPACE/artifacts"; mkdir -p "$A"
          flutter config --no-analytics
          flutter pub get
          flutter build web --release --base-href /zhenzhong/app/ --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          tar -czf "$A/zhenzhong-web.tar.gz" -C build/web .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 400

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.setup.outputs.build_all == 'true' && inputs.merge_request_id == '' && ((github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.create_release == true || inputs.create_release == 'true')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
    permissions:
      contents: write
    concurrency:
      group: release-ops
      cancel-in-progress: false
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Determine release tag
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=v${{ needs.setup.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name 'zhenzhong*' -exec cp {} release-assets/ \;
          find artifacts -type f -name 'flatpak-repo-*' -exec cp {} release-assets/ \;
          ls release-assets
      - name: Checksums
        working-directory: release-assets
        run: sha256sum * > ../SHA256SUMS.txt
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: Zhenzhong ${{ steps.meta.outputs.release_tag }}
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          for file in release-assets/* SHA256SUMS.txt; do
            for attempt in 1 2 3 4 5; do
              gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" "$file" --clobber && break || sleep $((attempt * 15))
            done
          done

  gitlab-sync:
    name: Trigger GitLab sync
    runs-on: ubuntu-latest
    needs: [release]
    if: always() && needs.release.result == 'success'
    steps:
      - name: Trigger GitLab pipeline
        run: |
          curl -fsSL --max-time 30 --retry 2 -X POST \
            -F token="${{ secrets.GITLAB_TRIGGER_TOKEN }}" \
            -F "ref=main" \
            -F "variables[GITHUB_RUN_ID]=${{ github.run_id }}" \
            -F "variables[RELEASE_TAG]=${{ needs.release.outputs.release_tag }}" \
            "https://gitlab.com/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/trigger/pipeline"
